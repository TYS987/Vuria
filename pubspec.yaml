name: vuria
description: A new Flutter project.

publish_to: 'none' 

version: 1.3.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter 
  cached_network_image: 3.4.1       
  collection: ^1.19.0               
  flutter_staggered_grid_view: 0.7.0 
  go_router: 12.1.3               
  json_path: 0.7.2                       
  path_provider: 2.1.4             
  provider: 6.1.5                   
  shared_preferences: 2.5.3        
  sqflite: 2.3.3+1                        
  timeago: 3.7.1                          
  url_launcher: 6.3.1                      
  flutter_native_splash: ^2.4.4     
  flutter_easyloading: ^3.0.5       
  flutter_inappwebview: ^6.1.5      
  permission_handler: ^10.2.0      
  image_picker: ^1.1.2              
  dio: ^5.4.0 
  intl: ^0.20.2
  awesome_snackbar_content: ^0.1.6
  from_css_color: 2.0.0                  
  in_app_purchase: 3.2.2        
  bot_toast: ^4.1.3               
  another_flushbar: ^1.12.0        
  flutter_spinkit: ^5.1.0        
  encrypt: ^5.0.3                  
  crypto: ^3.0.3                    
  flutter_secure_storage: ^9.2.4  
  device_info_plus: 11.3.0         
  vpn_detector: 1.0.1             
  devicelocale: ^0.8.1              
  flutter_native_timezone: ^2.0.0   
  system_keyboard_languages: ^0.0.2 
  flutter_local_notifications: ^19.3.1 
  screen_protector: 1.3.0         
  cupertino_icons: ^1.0.0   
  archive: ^4.0.7     

dependency_overrides:
  http: 1.4.0   
  uuid: ^4.0.0  
dev_dependencies:

  flutter_launcher_icons: 0.13.1    


  flutter_lints: 4.0.0              

  image: ^4.5.4


  flutter_test:
    sdk: flutter                    


flutter_launcher_icons:

  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: 'assets/images/MoodKinSoulResonanceCore.png' 

flutter_native_splash:

  background_image: "assets/images/empathyCosmicDance.png" 

flutter:
  uses-material-design: true 
  assets:
    - assets/fonts/
    - assets/MoodKinHeartwarmingDialogue.zip
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

  fonts:
    - family: 'AVENIR'
      fonts:
        - asset: assets/fonts/AVENIR-BLACK-3.ttf
          weight: 900
    - family: 'PingFang'
      fonts:
        - asset: assets/fonts/PingFang_Regular.ttf
          weight: 600
